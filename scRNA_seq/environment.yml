# Environment for the model training, Bayesian hyperparameter search,
# explainability and downstream statistical analyses
# (scRNA_seq/CSF, scRNA_seq/PBMC, scRNA_seq/xAI, scRNA_seq/multiseed).
#
# The single-cell preprocessing and integration notebooks
# (scRNA_seq/pre-processing) were run separately under Python 3.10.12 with
# Scanpy, scvi-tools (SCGen) and CellTypist; those package versions were not
# recorded in the original run.
#
# The R environment used for the STRING/KEGG/Reactome enrichment analysis is in
# Enrichment/environment.yml.
#
# xgboost was installed as the cuda120 build; training used device="cuda",
# tree_method="hist" on a single NVIDIA A100.

name: ms-rebuttal
channels:
  - conda-forge
dependencies:
  - python=3.11.16
  # model training, hyperparameter search, explainability
  - scikit-learn=1.9.1
  - xgboost=2.0.3
  - scikit-optimize=0.10.2
  - imbalanced-learn=0.14.2
  - shap=0.51.0
  # data handling and single-cell objects
  - scanpy=1.11.5
  - anndata=0.12.19
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=2.3.3
  # reporting and notebook execution
  - matplotlib-base=3.11.1
  - seaborn=0.13.2
  - joblib=1.6.0
  - requests=2.34.2
  - nbconvert=7.17.1
  - papermill=2.7.0
  - ipykernel=7.3.0
